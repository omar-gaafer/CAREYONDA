[project]
name = "careyonda-backend"
version = "0.0.0"
description = "Offline-first astronaut health and spaceflight hazard decision support"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    # Model A (NASA RR-1 environment Isolation Forest). Saved artifacts must be
    # loaded with the exact scikit-learn version recorded in their metadata;
    # requirements-model-a.txt pins the tested resolution.
    "numpy>=2.0,<2.5",
    "scikit-learn>=1.9,<1.10",
    "joblib>=1.4,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pytest>=8,<10",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = [".", ".."]
cache-dir = ".ruff_cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["app", "tests", "../simulator"]
mypy_path = [".", ".."]
strict = true
show_error_codes = true
warn_unreachable = true
cache_dir = ".mypy_cache"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "--strict-config --strict-markers -ra"
cache_dir = ".pytest_cache"
markers = [
    "unit: isolated module behavior",
    "integration: interaction between components using local or synthetic resources",
]
filterwarnings = ["error"]
